name: Links

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly sweep to catch external link rot even with no commits.
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: links-${{ github.ref }}
  # Only cancel superseded pull-request runs. Push/schedule runs share this
  # group, so an unconditional cancel would let the weekly sweep abort a push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check-links:
    name: Check external links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify link checker unit tests
        run: python -m unittest discover -s tools/tests -p "test_check_links.py"

      - name: Honest external link verification
        run: python tools/check_links.py --repo . --timeout 15 --max-retries 3
