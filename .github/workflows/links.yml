name: Links

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly sweep to catch external link rot even with no commits.
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lychee:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check links in README
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: >-
            --verbose
            --no-progress
            --max-retries 2
            --timeout 20
            --accept 200,204,206,429
            --exclude '^https://(www\.)?linkedin\.com'
            README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
